<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-LLM Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1a1a2e; color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .controls { display: flex; gap: 8px; }
  header button { background: #374151; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  header button:hover { background: #4b5563; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .user-msg { background: #4f46e5; color: #fff; padding: 12px 16px; border-radius: 16px 16px 4px 16px; max-width: 75%; align-self: flex-end; font-size: 14px; line-height: 1.5; }
  .model-block { display: flex; flex-direction: column; gap: 4px; }
  .model-label { font-size: 12px; font-weight: 600; padding: 4px 0; display: flex; align-items: center; gap: 6px; }
  .model-label .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .minimax .dot { background: #10b981; }
  .gemma .dot { background: #f59e0b; }
  .gpt .dot { background: #6b7280; }
  .model-content { background: #fff; border-radius: 4px 16px 16px 16px; padding: 12px 16px; font-size: 14px; line-height: 1.6; max-width: 85%; border: 1px solid #e5e7eb; }
  .model-content.waiting { color: #9ca3af; font-style: italic; }
  .model-content.error { color: #ef4444; border-color: #fca5a5; background: #fef2f2; }
  .input-row { background: #fff; border-top: 1px solid #e5e7eb; padding: 16px 20px; display: flex; gap: 10px; }
  textarea { flex: 1; border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 14px; font-size: 14px; resize: none; font-family: inherit; outline: none; line-height: 1.5; }
  textarea:focus { border-color: #4f46e5; }
  button.send { background: #4f46e5; color: #fff; border: none; width: 44px; height: 44px; border-radius: 10px; cursor: pointer; font-size: 18px; align-self: flex-end; }
  button.send:disabled { background: #9ca3af; cursor: not-allowed; }
  .retry-btn { background: #ef4444; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <h1>🧠 Multi-LLM Chat</h1>
  <div class="controls">
    <button onclick="clearChat()">Clear</button>
  </div>
</header>
<div id="chat"></div>
<div class="input-row">
  <textarea id="msgInput" rows="1" placeholder="Ask something..." onkeydown="handleKey(event)"></textarea>
  <button class="send" id="sendBtn" onclick="sendMessage()">↑</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

let conversation = [];
let pending = { minimax: false, gemma: false, gpt: false };

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
});

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || pending.minimax || pending.gemma || pending.gpt) return;
  
  input.value = '';
  input.style.height = 'auto';
  conversation.push({ role: 'user', content: text });
  
  const userEl = document.createElement('div');
  userEl.className = 'user-msg';
  userEl.textContent = text;
  chat.appendChild(userEl);
  chat.scrollTop = chat.scrollHeight;
  
  // Wait for all 3 models to respond
  const [minimaxDone, gemmaDone, gptDone] = await Promise.all([
    callMinimax(text, conversation),
    callGemma(text, conversation),
    callGPT(text, conversation)
  ]);
  
  // After all respond, record each other's responses in conversation
  // so next message, all models see what the others said
  if (minimaxDone) conversation.push({ role: 'assistant', content: minimaxDone, model: 'minimax' });
  if (gemmaDone)   conversation.push({ role: 'assistant', content: gemmaDone, model: 'gemma' });
  if (gptDone)     conversation.push({ role: 'assistant', content: gptDone, model: 'gpt' });
}

async function callMinimax(msg, history) {
  pending.minimax = true;
  const block = createModelBlock('minimax', 'MiniMax-M2.7');
  chat.appendChild(block.el);
  scroll();
  
  try {
    const response = await fetch('/api/multi-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, history })
    });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let done = false;
    while (!done) {
      const { value, done: d } = await reader.read();
      done = d;
      if (value) {
        const text = decoder.decode(value, { stream: !d });
        try {
          for (const line of text.split('\n')) {
            if (line.startsWith('data: ')) {
              const raw = line.slice(6);
              if (raw.trim() === '') continue;
              const data = JSON.parse(raw);
              if (data.model === 'minimax' && data.content) {
                block.content.textContent += data.content;
                scroll();
              }
            }
          }
        } catch(e) {}
      }
    }
    block.content.classList.remove('waiting');
  } catch (e) {
    block.content.classList.remove('waiting');
    block.content.classList.add('error');
    block.content.textContent = 'Error: ' + e.message;
  }
  pending.minimax = false;
  return block.content.textContent || null;
}

async function callGemma(msg, history) {
  pending.gemma = true;
  const block = createModelBlock('gemma', 'Gemma4:e4b');
  chat.appendChild(block.el);
  scroll();
  
  try {
    const response = await fetch('http://localhost:11434/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'gemma4:e4b',
        messages: history.map(m => ({ role: m.role, content: m.content })),
        stream: false
      })
    });
    const data = await response.json();
    block.content.textContent = data.message?.content || '(no response)';
    block.content.classList.remove('waiting');
  } catch (e) {
    block.content.classList.remove('waiting');
    block.content.classList.add('error');
    block.content.textContent = 'Error: ' + e.message;
  }
  pending.gemma = false;
  scroll();
  return block.content.textContent || null;
}

async function callGPT(msg, history) {
  pending.gpt = true;
  const block = createModelBlock('gpt', 'GPT-5.4');
  chat.appendChild(block.el);
  scroll();
  
  try {
    const response = await fetch('/api/multi-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, history })
    });
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let done = false;
    while (!done) {
      const { value, done: d } = await reader.read();
      done = d;
      if (value) {
        const text = decoder.decode(value, { stream: !d });
        try {
          for (const line of text.split('\n')) {
            if (line.startsWith('data: ')) {
              const raw = line.slice(6);
              if (raw.trim() === '') continue;
              const data = JSON.parse(raw);
              if (data.model === 'gpt' && data.content) {
                block.content.textContent += data.content;
                scroll();
              }
            }
          }
        } catch(e) {}
      }
    }
    block.content.classList.remove('waiting');
  } catch (e) {
    block.content.classList.remove('waiting');
    block.content.classList.add('error');
    block.content.textContent = 'Error: ' + e.message;
  }
  pending.gpt = false;
  return block.content.textContent || null;
}

function createModelBlock(cls, label) {
  const el = document.createElement('div');
  el.className = `model-block ${cls}`;
  el.innerHTML = `<div class="model-label"><span class="dot"></span>${label}</div>
    <div class="model-content waiting"><span class="typing">●</span> waiting...</div>`;
  return { el, content: el.querySelector('.model-content') };
}

function scroll() {
  chat.scrollTop = chat.scrollHeight;
}

function clearChat() {
  chat.innerHTML = '';
  conversation = [];
}
</script>
</body>
</html>
