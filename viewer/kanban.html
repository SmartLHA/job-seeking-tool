<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Kanban Board</title>
    <style>
        .kanban-board {
            display: flex;
            justify-content: space-around;
        }
        .column {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
        .task {
            background-color: #ffffff;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="kanban-board">
        <div class="column">
            <h2>To Do</h2>
            <div class="task">Research target companies</div>
            <div class="task">Update resume</div>
            <div class="task">Prepare interview questions</div>
        </div>
        <div class="column">
            <h2>In Progress</h2>
            <div class="task">Writing cover letter</div>
        </div>
        <div class="column">
            <h2>Done</h2>
            <div class="task">Submitted applications</div>
        </div>
    </div>
</body>
</html>
