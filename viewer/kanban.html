<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mic's Kanban</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--surface); }
  .topbar h1 { font-size: 1.1rem; font-weight: 600; flex: 1; }
  .topbar a { color: var(--accent); text-decoration: none; font-size: 0.85rem; margin-right: 1rem; }
  .topbar a:hover { text-decoration: underline; }
  .status-bar { font-size: 0.8rem; color: var(--muted); padding: 0.25rem 1.5rem; background: var(--bg); border-bottom: 1px solid var(--border); }
  .board-wrap { padding: 1rem; overflow-x: auto; }
  #board { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0.75rem; align-items: start; min-width: 600px; }
  .column { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .column-header { display: flex; align-items: center; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); background: var(--surface2); gap: 0.5rem; }
  .column-icon { font-size: 1rem; }
  .column-title { font-size: 0.85rem; font-weight: 600; flex: 1; }
  .column-count-badge { background: var(--border); color: var(--muted); font-size: 0.7rem; padding: 2px 7px; border-radius: 10px; }
  .column-add-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 2px 6px; border-radius: 4px; }
  .column-add-btn:hover { background: var(--border); color: var(--text); }
  .column-cards { min-height: 60px; padding: 0.5rem; }
  .column-cards.drag-over { background: rgba(88, 166, 255, 0.05); }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem 0.75rem; margin-bottom: 0.5rem; cursor: grab; font-size: 0.85rem; line-height: 1.4; }
  .card:hover { border-color: var(--accent); }
  .card[draggable]:active { cursor: grabbing; opacity: 0.7; }
  .card-top { display: flex; align-items: flex-start; gap: 0.4rem; margin-bottom: 0.3rem; }
  .priority-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .priority-dot.high { background: var(--red); }
  .priority-dot.medium { background: var(--yellow); }
  .priority-dot.low { background: var(--muted); }
  .card-title { font-weight: 600; }
  .card-description { color: var(--muted); font-size: 0.8rem; margin: 0.3rem 0; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.4rem; }
  .tag { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-size: 0.7rem; padding: 1px 6px; border-radius: 4px; }
  .card-link-chip { background: var(--surface2); border: 1px solid var(--border); color: var(--accent); font-size: 0.7rem; padding: 1px 6px; border-radius: 4px; text-decoration: none; }
  .card-actions { display: flex; gap: 0.25rem; margin-top: 0.4rem; opacity: 0; transition: opacity 0.15s; }
  .card:hover .card-actions { opacity: 1; }
  .card-action-btn { background: none; border: none; cursor: pointer; font-size: 0.8rem; padding: 2px 4px; border-radius: 3px; }
  .card-action-btn:hover { background: var(--border); }
  .column-footer { padding: 0.5rem; border-top: 1px solid var(--border); }
  .add-card-footer-btn { width: 100%; background: none; border: 1px dashed var(--border); color: var(--muted); cursor: pointer; font-size: 0.8rem; padding: 0.4rem; border-radius: 4px; }
  .add-card-footer-btn:hover { border-color: var(--accent); color: var(--accent); }
  .empty-column { text-align: center; color: var(--muted); padding: 1.5rem; font-size: 0.85rem; }
  /* Modal */
  #cardModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
  #cardModal.show { display: flex; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 420px; max-width: 95vw; padding: 1.5rem; }
  .modal-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .modal-title-row h2 { font-size: 1rem; }
  .modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.2rem; }
  .modal-close:hover { color: var(--text); }
  .form-group { margin-bottom: 0.85rem; }
  .form-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
  .form-group input, .form-group textarea, .form-group select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 0.5rem; font-size: 0.85rem; font-family: inherit; }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .priority-options { display: flex; gap: 0.5rem; }
  .priority-option { flex: 1; text-align: center; padding: 0.4rem; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
  .priority-option.selected { border-color: var(--accent); background: rgba(88,166,255,0.1); }
  .priority-option.high-pri { color: var(--red); }
  .priority-option.medium-pri { color: var(--yellow); }
  .priority-option.low-pri { color: var(--muted); }
  .tags-area { display: flex; flex-wrap: wrap; gap: 0.3rem; min-height: 28px; padding: 0.3rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); cursor: text; }
  .tags-area:focus-within { border-color: var(--accent); }
  .tag-chip { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; display: flex; align-items: center; gap: 4px; }
  .tag-chip button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.7rem; padding: 0; }
  .tag-chip button:hover { color: var(--red); }
  .tag-input { border: none; background: transparent; color: var(--text); font-size: 0.8rem; outline: none; min-width: 80px; }
  #deleteBtn { background: none; border: 1px solid var(--red); color: var(--red); cursor: pointer; font-size: 0.8rem; padding: 0.5rem 1rem; border-radius: 6px; }
  #deleteBtn:hover { background: rgba(248,81,73,0.1); }
  .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
  .btn-primary { background: var(--accent); border: none; color: #fff; cursor: pointer; font-size: 0.85rem; padding: 0.5rem 1.2rem; border-radius: 6px; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text); cursor: pointer; font-size: 0.85rem; padding: 0.5rem 1.2rem; border-radius: 6px; }
  .btn-secondary:hover { border-color: var(--muted); }
  #statusMsg { font-size: 0.8rem; }
  .status-saved { color: var(--green); }
  .status-error { color: var(--red); }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html">← Viewer</a>
  <a href="openclaw_status.html">OpenClaw</a>
  <a href="openclaw_pulse_viewer.html">Pulse</a>
  <h1>📋 Mic's Project Kanban</h1>
  <span id="statusMsg"></span>
</div>
<div class="status-bar">最後更新：<span id="lastUpdated">—</span></div>

<div class="board-wrap">
  <div id="board">載入中…</div>
</div>

<!-- Card Edit Modal -->
<div id="cardModal">
  <div class="modal-box">
    <div class="modal-title-row">
      <h2 id="modalTitle">新增任務</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <form id="cardForm">
      <div class="form-group">
        <label>標題</label>
        <input type="text" id="fTitle" required placeholder="任務標題">
      </div>
      <div class="form-group">
        <label>描述</label>
        <textarea id="fDesc" placeholder="可選描述…"></textarea>
      </div>
      <div class="form-group">
        <label>連結</label>
        <input type="url" id="fLink" placeholder="https://…">
      </div>
      <div class="form-group">
        <label>優先級</label>
        <div class="priority-options">
          <div class="priority-option high-pri selected" data-val="high">高</div>
          <div class="priority-option medium-pri" data-val="medium">中</div>
          <div class="priority-option low-pri" data-val="low">低</div>
        </div>
      </div>
      <div class="form-group">
        <label>標籤</label>
        <div class="tags-area" id="tagsArea">
          <input type="text" class="tag-input" id="tagInput" placeholder="輸入後按 Enter 添加">
        </div>
      </div>
      <input type="hidden" id="fCardId">
      <input type="hidden" id="fColumn">
      <div class="modal-actions">
        <button type="button" id="deleteBtn" style="margin-right:auto;display:none">🗑️ 刪除</button>
        <button type="button" class="btn-secondary" id="cancelBtn">取消</button>
        <button type="submit" class="btn-primary">儲存</button>
      </div>
    </form>
  </div>
</div>

<script src="kanban.js"></script>
</body>
</html>
