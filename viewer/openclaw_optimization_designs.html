<meta charset="UTF-8">

<title>OpenClaw 優化設計方案</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }

.header { background: #1a1d27; padding: 20px 30px; border-bottom: 1px solid #2a2d3a; }
.header h1 { font-size: 1.4rem; color: #7dd3fc; margin-bottom: 4px; }
.header p { font-size: 0.85rem; color: #888; }

.container { max-width: 900px; margin: 0 auto; padding: 20px; }

.search-bar { margin-bottom: 20px; }
.search-bar input {

  border-radius: 8px; background: #1a1d27; color: #e0e0e0;
  font-size: 0.9rem;
}
.search-bar input::placeholder { color: #666; }

.item { background: #161922; border: 1px solid #2a2d3a; border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
.item-header { padding: 14px 18px; cursor: pointer; display: flex; align-items: center; gap: 10px; user-select: none; }
.item-header:hover { background: #1e2231; }

.item-number {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
}
.priority-high { background: #ef4444; color: #fff; }
.priority-medium { background: #f59e0b; color: #111; }
.priority-low { background: #22c55e; color: #111; }

.item-title { flex: 1; font-size: 0.95rem; font-weight: 600; color: #f1f5f9; }
.item-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; background: #2a2d3a; color: #888; }
.item-arrow { color: #555; transition: transform 0.2s; font-size: 1.2rem; }
.item.open .item-arrow { transform: rotate(90deg); }

.item-body { display: none; padding: 0 18px 18px; }
.item.open .item-body { display: block; }

.item-meta { font-size: 0.75rem; color: #666; margin: 10px 0; padding-bottom: 8px; border-bottom: 1px solid #1e2231; }

.existing-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(34,197,94,0.15); color: #4ade80; font-size: 0.7rem; padding: 3px 10px; border-radius: 12px; margin-left: 6px; border: 1px solid rgba(34,197,94,0.3); }

.option { background: #1e2231; border-radius: 8px; margin-top: 12px; padding: 14px; }
.option-tag { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; display: inline-flex; align-items: center; gap: 6px; }
.option-a { background: #3b82f6; color: #fff; }
.option-b { background: #8b5cf6; color: #fff; }
.recommended { background: #22c55e; color: #111; font-size: 0.65rem; padding: 1px 6px; border-radius: 3px; }

.confidence-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.conf-label { font-size: 0.7rem; color: #888; width: 60px; }
.conf-bar-wrap { flex: 1; height: 6px; background: #2a2d3a; border-radius: 3px; overflow: hidden; }
.conf-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
.conf-a .conf-bar-fill { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
.conf-b .conf-bar-fill { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
.conf-pct { font-size: 0.72rem; font-weight: 700; min-width: 36px; text-align: right; }
.conf-a .conf-pct { color: #60a5fa; }
.conf-b .conf-pct { color: #a78bfa; }

.option h4 { font-size: 0.88rem; color: #e0e0e0; margin-bottom: 8px; }
.option p { font-size: 0.82rem; color: #9ca3af; line-height: 1.6; margin-bottom: 10px; }

.architecture, .flow { background: #111318; border-radius: 6px; padding: 10px 12px; margin: 8px 0; font-size: 0.78rem; color: #86efac; font-family: 'Courier New', monospace; white-space: pre; overflow-x: auto; }
.workflow { background: #111318; border-radius: 6px; padding: 10px 12px; margin: 8px 0; }
.workflow li { font-size: 0.8rem; color: #d1d5db; margin: 4px 0 4px 18px; }
.workflow ol { padding-left: 0; list-style: none; counter-reset: step; }
.workflow ol li { counter-increment: step; }
.workflow ol li::before { content: counter(step); background: #3b82f6; color: #fff; width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.7rem; margin-right: 8px; }

.pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.pros, .cons { font-size: 0.78rem; padding: 8px 10px; border-radius: 6px; }
.pros { background: rgba(34,197,94,0.1); color: #4ade80; }
.cons { background: rgba(239,68,68,0.1); color: #f87171; }
.pros::before { content: "✅ "; }
.cons::before { content: "❌ "; }

.summary-box { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 8px; padding: 12px 14px; margin-top: 14px; }
.summary-box h4 { font-size: 0.82rem; color: #7dd3fc; margin-bottom: 6px; }
.summary-box p { font-size: 0.8rem; color: #9ca3af; }

.status-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #1a1d27; border-top: 1px solid #2a2d3a;
  padding: 10px 20px; font-size: 0.8rem; color: #666;
  display: flex; gap: 20px;

.status-bar span { color: #4ade80; }

.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-btn {

.filter-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }

.progress-bar { height: 3px; background: #2a2d3a; margin-bottom: 20px; border-radius: 2px; }
.progress-fill { height: 100%; background: #3b82f6; border-radius: 2px; transition: width 0.3s; }

.highlight-bar { background: linear-gradient(135deg, rgba(34,197,94,0.08), rgba(34,197,94,0.03)); border: 1px solid rgba(34,197,94,0.2); border-radius: 6px; padding: 8px 12px; margin-bottom: 10px; font-size: 0.75rem; color: #4ade80; }
.highlight-bar::before { content: "🔥 "; }
</style>
</head>

    return html;
  }

  let body = `<div class="item-body">`;
  body += `<div class="item-meta">優先：${priorityLabels[d.priority]} · 来源：${d.source}</div>`;
  if (d.desc) body += `<p style="font-size:0.85rem;color:#9ca3af;margin-bottom:10px">${d.desc}</p>`;
  if (d.existingSolution) {
    body += `<div class="highlight-bar">已有現成方案：${d.existingSolution}</div>`;
    if (d.existingUrl) body += `<p style="font-size:0.75rem;color:#666;margin-top:4px">🔗 ${d.existingUrl}</p>`;
  }
  body += optHTML(d.optionA, 'A');
  body += optHTML(d.optionB, 'B');
  if (d.optionC) body += optHTML(d.optionC, 'C', '（升級）');
  if (d.summary) body += `<div class="summary-box"><h4>💡 總結</h4><p>${d.summary}</p></div>`;
  body += `</div>`;

  return `<div class="item${isOpen ? ' open' : ''}" data-id="${d.id}">
    <div class="item-header">
      <div class="item-number ${priorityColors[d.priority]}">${d.id}</div>
      <div class="item-title">${d.title}</div>
      <span class="item-badge">${priorityLabels[d.priority]}</span>
      ${d.existingSolution ? '<span class="existing-badge">✅ 已有</span>' : ''}
      <div class="item-arrow">${isOpen ? '▼' : '▶'}</div>
    </div>
    ${body}
  </div>`;
}

function render(filter) {
  try {
    const list = document.getElementById('itemsList');
    if (!list) {
      console.error('[render] itemsList not found! Creating it.');
      const container = document.querySelector('.container') || document.body;
      const newList = document.createElement('div');
      newList.id = 'itemsList';
      container.appendChild(newList);
      return render(filter);
    }
    const search = (document.getElementById('searchInput') || {value:''}).value.toLowerCase();
    const filtered = designs.filter(d => {
      if (filter !== 'all' && d.priority !== filter) return false;
      if (search && !d.title.toLowerCase().includes(search) && !d.desc.toLowerCase().includes(search)) return false;
      return true;
    });
    document.getElementById('visibleCount').textContent = filtered.length + ' 個項目';
    const html = filtered.map(buildItemHTML).join('');
    list.innerHTML = html;
    console.log('[render ok] items:', filtered.length, 'html length:', html.length);
  } catch(e) {
    console.error('[render error]', e);
  }
}

function toggle(id) {
  if (openItems.has(id)) openItems.delete(id);
  else openItems.add(id);
  render(currentFilter);
}

let currentFilter = 'all';

document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render(currentFilter);
    });
  });
  document.getElementById('searchInput').addEventListener('input', () => render(currentFilter));
  render(currentFilter);

  // Event delegation for item toggling (toggle is inside IIFE, not on window)
  document.getElementById('itemsList').addEventListener('click', function(e) {
    const header = e.target.closest('.item-header');
    if (!header) return;
    const id = parseInt(header.closest('.item').dataset.id, 10);
    if (openItems.has(id)) openItems.delete(id);
    else openItems.add(id);
    render(currentFilter);
  });
});

})();
</script>
</body>
</html>
