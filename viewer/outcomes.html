<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Outcomes Analytics</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --card: #16213e;
      --text: #e0e0e0;
      --muted: #8892a4;
      --accent: #4f9cf9;
      --success: #52c41a;
      --warning: #faad14;
      --danger: #ff4d4f;
      --muted2: #6b7a99;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }
    h1 { font-size: 1.5rem; margin-bottom: 20px; color: var(--accent); }
    h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--text); }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .header a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .header a:hover { text-decoration: underline; }

    /* Summary Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .card .value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
    }
    .card .label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .card.applied .value { color: var(--success); }
    .card.interview .value { color: #a0d911; }
    .card.rejected .value { color: var(--danger); }
    .card.rate .value { color: var(--warning); }

    /* Sections */
    .section {
      background: var(--card);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    /* Status Breakdown */
    .breakdown {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .breakdown-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .dot.not_applied { background: var(--muted2); }
    .dot.applied { background: var(--success); }
    .dot.interviewed { background: #a0d911; }
    .dot.rejected { background: var(--danger); }
    .dot.ignored { background: var(--muted); }

    /* Bar Chart */
    .bar-chart {
      margin-top: 12px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .bar-label {
      width: 100px;
      font-size: 0.85rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      height: 20px;
      background: rgba(255,255,255,0.05);
      border-radius: 4px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }
    .bar-fill.not_applied { background: var(--muted2); }
    .bar-fill.applied { background: var(--success); }
    .bar-fill.interviewed { background: #a0d911; }
    .bar-fill.rejected { background: var(--danger); }
    .bar-fill.ignored { background: var(--muted); }
    .bar-count {
      width: 50px;
      text-align: right;
      font-size: 0.85rem;
      color: var(--text);
    }

    /* Timeline Chart */
    .timeline {
      margin-top: 12px;
    }
    .timeline-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    .timeline-label {
      width: 70px;
      font-size: 0.75rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .timeline-track {
      flex: 1;
      height: 14px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      position: relative;
    }
    .timeline-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
    }
    .timeline-count {
      width: 30px;
      text-align: right;
      font-size: 0.75rem;
    }

    /* Jobs List */
    .jobs-list {
      max-height: 400px;
      overflow-y: auto;
    }
    .job-item {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .job-item:last-child { border-bottom: none; }
    .job-info { flex: 1; }
    .job-title { font-size: 0.9rem; font-weight: 600; }
    .job-company { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .job-meta { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .job-actions { display: flex; gap: 6px; flex-shrink: 0; margin-left: 12px; }
    
    /* Buttons */
    .btn {
      font-size: 0.75rem;
      padding: 4px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: rgba(255,255,255,0.08);
      color: var(--text);
      transition: background 0.15s;
    }
    .btn:hover { background: rgba(255,255,255,0.15); }
    .btn.applied { background: rgba(82, 196, 26, 0.2); color: var(--success); }
    .btn.interviewed { background: rgba(160, 217, 17, 0.2); color: #a0d911; }
    .btn.rejected { background: rgba(255, 77, 79, 0.2); color: var(--danger); }
    .btn.ignored { background: rgba(139, 162, 184, 0.2); color: var(--muted); }

    .status-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 3px;
      background: rgba(255,255,255,0.08);
      color: var(--muted);
    }
    .status-badge.applied { background: rgba(82,196,26,0.2); color: var(--success); }
    .status-badge.interviewed { background: rgba(160,217,17,0.2); color: #a0d911; }
    .status-badge.rejected { background: rgba(255,77,79,0.2); color: var(--danger); }
    .status-badge.ignored { background: rgba(139,162,184,0.2); }
    .status-badge.not_applied { background: rgba(139,162,184,0.15); color: var(--muted2); }

    .empty {
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .loading { text-align: center; padding: 30px; color: var(--muted); }
  </style>
</head>
<body>

<div class="header">
  <h1>📊 Job Outcomes Analytics</h1>
  <a href="/viewer/index.html">← Back to Dashboard</a>
</div>

<div id="app">
  <div class="loading">Loading...</div>
</div>

<script>
const API = '/api';

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function statusLabel(s) {
  const map = {
    not_applied: 'Not Applied',
    applied: 'Applied',
    interviewed: 'Interview',
    rejected: 'Rejected',
    ignored: 'Ignored'
  };
  return map[s] || s;
}

function badgeClass(s) {
  return 'status-badge ' + s;
}

function renderSummary(summary) {
  const { total, applied, interviewed, rejected, not_applied, rejection_rate } = summary;
  const rate = rejection_rate;
  const totalResponses = applied + interviewed + rejected + ignored;
  return `
    <div class="cards">
      <div class="card">
        <div class="value">${total}</div>
        <div class="label">Total Jobs</div>
      </div>
      <div class="card applied">
        <div class="value">${applied}</div>
        <div class="label">Applied</div>
      </div>
      <div class="card interview">
        <div class="value">${interviewed}</div>
        <div class="label">Interviews</div>
      </div>
      <div class="card rejected">
        <div class="value">${rejected}</div>
        <div class="label">Rejected</div>
      </div>
      <div class="card rate">
        <div class="value">${rate}%</div>
        <div class="label">Rejection Rate</div>
      </div>
    </div>
  `;
}

function renderBreakdown(summary) {
  const counts = [
    { status: 'not_applied', label: 'Not Applied' },
    { status: 'applied', label: 'Applied' },
    { status: 'interviewed', label: 'Interview' },
    { status: 'rejected', label: 'Rejected' },
    { status: 'ignored', label: 'Ignored' },
  ];
  const max = Math.max(summary.total, 1);
  return `
    <div class="breakdown">
      ${counts.map(c => `
        <div class="breakdown-item">
          <div class="dot ${c.status}"></div>
          <span>${c.label}: ${summary[c.status] || 0}</span>
        </div>
      `).join('')}
    </div>
    <div class="bar-chart">
      ${counts.map(c => {
        const count = summary[c.status] || 0;
        const pct = Math.round((count / max) * 100);
        return `
        <div class="bar-row">
          <div class="bar-label">${c.label}</div>
          <div class="bar-track"><div class="bar-fill ${c.status}" style="width:${pct}%"></div></div>
          <div class="bar-count">${count}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function renderTimeline(timeline) {
  const max = Math.max(...timeline.map(d => d.applied + d.interviewed), 1);
  return `
    <div class="timeline">
      ${timeline.slice(-14).map(d => {
        const total = d.applied + d.interviewed;
        const pct = Math.round((total / max) * 100);
        const shortDate = d.date.slice(5); // MM-DD
        return `
        <div class="timeline-bar">
          <div class="timeline-label">${shortDate}</div>
          <div class="timeline-track">
            <div class="timeline-fill" style="width:${pct}%"></div>
          </div>
          <div class="timeline-count">${total}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

function renderJobs(jobs) {
  if (!jobs.length) {
    return '<div class="empty">No jobs tracked yet. Add jobs via the Job Pre-fill page.</div>';
  }
  return `
    <div class="jobs-list">
      ${jobs.map(job => `
        <div class="job-item">
          <div class="job-info">
            <div class="job-title">${job.job_title || job.id}</div>
            <div class="job-company">${job.company || ''} ${job.location ? '· ' + job.location : ''}</div>
            <div class="job-meta">
              ${job.applied_at ? 'Applied ' + job.applied_at.slice(0,10) : ''}
              ${job.source ? ' · ' + job.source : ''}
            </div>
          </div>
          <div class="job-actions">
            <span class="${badgeClass(job.status)}">${statusLabel(job.status)}</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

async function load() {
  try {
    const [summary, timeline, jobs] = await Promise.all([
      api('GET', '/outcomes-summary'),
      api('GET', '/outcomes-timeline'),
      api('GET', '/jobs'),
    ]);
    
    document.getElementById('app').innerHTML = `
      <div class="cards">
        <div class="card">
          <div class="value">${summary.total}</div>
          <div class="label">Total Jobs</div>
        </div>
        <div class="card applied">
          <div class="value">${summary.applied}</div>
          <div class="label">Applied</div>
        </div>
        <div class="card interview">
          <div class="value">${summary.interviewed}</div>
          <div class="label">Interviews</div>
        </div>
        <div class="card rejected">
          <div class="value">${summary.rejected}</div>
          <div class="label">Rejected</div>
        </div>
        <div class="card rate">
          <div class="value">${summary.rejection_rate}%</div>
          <div class="label">Rejection Rate</div>
        </div>
      </div>

      <div class="section">
        <h2>Status Breakdown</h2>
        ${renderBreakdown(summary)}
      </div>

      <div class="section">
        <h2>Applications Over Time (Last 14 Days)</h2>
        ${renderTimeline(timeline)}
      </div>

      <div class="section">
        <h2>All Jobs</h2>
        ${renderJobs(jobs)}
      </div>
    `;
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="empty">Error loading data: ${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
