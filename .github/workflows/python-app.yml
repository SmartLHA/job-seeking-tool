# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/job-tool-playwright

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v3
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
    - name: Install Chromium for browser tests
      run: python -m playwright install --with-deps chromium
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        PYTHONPATH=. pytest -m "not required_browser" tests/
    - name: Required browser coverage
      env:
        JOB_TOOL_REQUIRE_BROWSER: "1"
        JOB_TOOL_BROWSER_TEST_HOME: ${{ runner.temp }}/job-tool-browser-home
      run: |
        mkdir -p "$JOB_TOOL_BROWSER_TEST_HOME"
        env HOME="$JOB_TOOL_BROWSER_TEST_HOME" PYTHONPATH=. pytest --strict-markers -m required_browser \
          tests/test_ui.py tests/test_bulk_paste.py tests/test_review_queue_browser.py tests/test_search_replay_browser.py \
          tests/test_tailor_cover_dom.py tests/test_viewer_api_boundary_browser.py \
          --junitxml="${{ runner.temp }}/job-tool-browser-results.xml"
    - name: Test proof-of-concepts
      run: |
        # poc/*/tests defines another tests package, so keep a separate process.
        PYTHONPATH=. pytest poc/
